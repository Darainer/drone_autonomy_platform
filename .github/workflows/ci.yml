name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── 1. ROS2 Docker build ──────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ROS2 Docker image
        run: docker build -t drone_autonomy_platform .

  # ── 2. Agent smoke test ───────────────────────
  #    Proves Temporal + worker plumbing works end-to-end in mock mode.
  #    No LLM calls, no filesystem assertions — just workflow machinery.
  agent-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent dependencies
        run: pip install -r agents/requirements.txt

      - name: Validate docker compose config
        run: docker compose -f docker/docker-compose.yml config --quiet

      - name: Run agent unit tests
        env:
          AGENT_MOCK: "true"
          WORKSPACE: "/tmp/test-workspace"
        run: pytest agents/tests/ -v --tb=short

      - name: Build agent Docker image
        run: |
          DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) \
            docker compose -f docker/docker-compose.yml build orchestrator

      - name: Smoke test — workflow runs end-to-end
        run: |
          docker compose -f docker/docker-compose.yml up -d --wait temporal-db temporal

          DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) AGENT_MOCK=true \
            docker compose -f docker/docker-compose.yml up -d orchestrator ros2-worker sim-worker

          # Wait for workers to register with Temporal
          sleep 8

          docker compose -f docker/docker-compose.yml exec -T orchestrator \
            python3 scripts/submit_task.py \
              "Smoke test task" \
              --plan '{"summary":"smoke test","safety_critical":false,"affected_packages":[],"steps":[{"agent":"infra","task_queue":"orchestrator","action":"Smoke test task","depends_on":[]}]}' \
              --timeout 60 || {
            echo "--- orchestrator logs ---"
            docker compose -f docker/docker-compose.yml logs orchestrator
            docker compose -f docker/docker-compose.yml down
            exit 1
          }

          docker compose -f docker/docker-compose.yml down

  # ── 3. Agent action tests ─────────────────────
  #    Same workflow as smoke, but verifies real filesystem output.
  #    Fails independently so you know if plumbing works but I/O doesn't.
  agent-actions:
    runs-on: ubuntu-latest
    needs: agent-smoke
    steps:
      - uses: actions/checkout@v4

      - name: Build agent Docker image
        run: |
          DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) \
            docker compose -f docker/docker-compose.yml build orchestrator

      - name: Write action — workflow creates a file
        run: |
          docker compose -f docker/docker-compose.yml up -d --wait temporal-db temporal

          DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) AGENT_MOCK=true \
            docker compose -f docker/docker-compose.yml up -d orchestrator ros2-worker sim-worker

          sleep 8

          docker compose -f docker/docker-compose.yml exec -T orchestrator \
            python3 scripts/submit_task.py \
              "Write a placeholder file to launch/ci-test.md" \
              --plan '{"summary":"write action test","safety_critical":false,"affected_packages":[],"steps":[{"agent":"infra","task_queue":"orchestrator","action":"Write a placeholder file to launch/ci-test.md","depends_on":[]}]}' \
              --timeout 60 || {
            echo "--- orchestrator logs ---"
            docker compose -f docker/docker-compose.yml logs orchestrator
            docker compose -f docker/docker-compose.yml down
            exit 1
          }

          docker compose -f docker/docker-compose.yml down

          test -f launch/ci-test.md || { echo "ERROR: launch/ci-test.md was not created"; exit 1; }

  # ── 4. Safety-path warning (warn-only, advisory) ──
  #    Runs on pull_request only (no-op/skipped on push). Diffs the PR against
  #    its base ref; if any changed path is under src/control/, src/safety/, or
  #    src/navigation/ and the PR does not carry the `safety-reviewed` label,
  #    writes a warning naming the changed files to the job summary. This is
  #    advisory only and always exits 0 — nothing here blocks a merge. Making
  #    this check required is a branch-protection setting a human still needs
  #    to configure; the `safety-reviewed` label also needs to be created by a
  #    human before it can be applied to PRs.
  safety-path-warning:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Warn on unreviewed safety-critical path changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'safety-reviewed') }}
        run: |
          CHANGED_FILES=$(git diff --name-only "${BASE_SHA}...HEAD" 2>/dev/null || true)

          SAFETY_FILES=$(printf '%s\n' "$CHANGED_FILES" | grep -E '^(src/control/|src/safety/|src/navigation/)' || true)

          if [ -z "$SAFETY_FILES" ]; then
            echo "No changes under \`src/control/\`, \`src/safety/\`, or \`src/navigation/\` in this PR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$HAS_LABEL" = "true" ]; then
            {
              echo "### Safety-critical path changed — \`safety-reviewed\` label present"
              echo
              echo "This PR changes files under a safety-critical path, and carries the \`safety-reviewed\` label:"
              echo
              echo '```'
              printf '%s\n' "$SAFETY_FILES"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### :warning: Safety-critical path changed — no \`safety-reviewed\` label"
            echo
            echo "This PR changes files under \`src/control/\`, \`src/safety/\`, and/or \`src/navigation/\`:"
            echo
            echo '```'
            printf '%s\n' "$SAFETY_FILES"
            echo '```'
            echo
            echo "This is advisory only — nothing here blocks the merge. Fill in the DO-178C"
            echo "checklist section of the PR template and add the \`safety-reviewed\` label once"
            echo "a human has reviewed these changes. (Requiring this check via branch protection"
            echo "is a follow-up a human still needs to configure — see CONTRIBUTING.md.)"
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0
